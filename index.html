<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Finance Analyser</title>
<meta name="description" content="Monthly income vs expenditure analyser with self-learning categories and a dream planner. Data lives in your OneDrive.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a78d6'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f8f9fb; --line: #e3e5e9;
  --text: #15171a; --text-2: #52565e; --muted: #80858f;
  --accent: #2a78d6; --accent-soft: #e6f0fc;
  --income: #2a78d6; --expense: #eb6834; --saving: #1baf7a;
  --good: #128a4e; --good-soft: #e3f5ea; --warn: #a86400; --warn-soft: #fdf1dc; --bad: #c8322f; --bad-soft: #fdebea;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --other:#a3a7ae;
  --radius: 12px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #121314; --surface: #1a1a19; --surface-2: #222321; --line: #2f302e;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;
    --accent: #3987e5; --accent-soft: #1d2a3b;
    --income: #3987e5; --expense: #d95926; --saving: #199e70;
    --good: #3cbf7a; --good-soft: #17301f; --warn: #e3a33a; --warn-soft: #33270f; --bad: #ef6b68; --bad-soft: #3a1b1a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767; --other:#6c6d68;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
h2 { font-size: 18px; } h3 { font-size: 15px; } h4 { font-size: 13px; color: var(--text-2); font-weight: 600; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 20px; }
.brand-name { font-weight: 700; font-size: 16px; }
.brand-sub { font-size: 12px; color: var(--muted); }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.save-pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
.save-pill.ok { color: var(--good); }
.save-pill.err { color: var(--bad); background: var(--bad-soft); }

.tabs { display: flex; gap: 2px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; position: sticky; top: 61px; z-index: 19; }
.tabs button { border: 0; background: none; padding: 12px 14px; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--expense); color: #fff; font-size: 11px; line-height: 18px; text-align: center; margin-left: 4px; }

main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; }
.tab > * + * { margin-top: 16px; }

/* buttons & inputs */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: .5; cursor: default; }
input[type=text], input[type=number], input[type=date], input[type=password], input[type=search], select, textarea {
  border: 1px solid var(--line); background: var(--surface); padding: 7px 10px; border-radius: 8px; min-width: 0; }
input:focus, select:focus, textarea:focus, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-2); font-weight: 500; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.hint { font-size: 12px; color: var(--muted); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.grid.k4 { grid-template-columns: repeat(4, 1fr); }
.grid.c2 { grid-template-columns: 1fr 1fr; }
.grid.c3 { grid-template-columns: 2fr 1fr; }
@media (max-width: 900px) { .grid.k4 { grid-template-columns: 1fr 1fr; } .grid.c2, .grid.c3 { grid-template-columns: 1fr; } }
@media (max-width: 480px) { .grid.k4 { grid-template-columns: 1fr; } }

.kpi .label { font-size: 12px; color: var(--text-2); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center; gap: 6px; }
.kpi .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.kpi .value { font-size: 26px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.delta-up { color: var(--good); } .delta-down { color: var(--bad); }

.chart-box { position: relative; height: 280px; }
.chart-box.tall { height: 320px; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.legend li { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; font-size: 13px; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; }
.legend .pct { color: var(--muted); min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
.legend .amt { font-variant-numeric: tabular-nums; }
.pie-wrap { display: grid; grid-template-columns: 200px 1fr; gap: 16px; align-items: center; }
@media (max-width: 520px) { .pie-wrap { grid-template-columns: 1fr; } }

.insights { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.insights li { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.insights .ic { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }

/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--text-2); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
td.amt, th.amt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:hover td { background: var(--surface-2); }
.debit { color: var(--text); } .credit { color: var(--good); }
.desc-sub { font-size: 11px; color: var(--muted); max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td select { max-width: 190px; padding: 4px 6px; }

.status { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
.status.confirmed { background: var(--good-soft); color: var(--good); }
.status.auto { background: var(--accent-soft); color: var(--accent); }
.status.suggested { background: var(--warn-soft); color: var(--warn); }
.status.unknown { background: var(--bad-soft); color: var(--bad); }

/* review */
.review-card { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.review-card + .review-card { margin-top: 10px; }
.review-card .q { font-weight: 600; }
.review-card .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.conf-bar { height: 6px; width: 90px; background: var(--line); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
.conf-bar > i { display: block; height: 100%; background: var(--warn); }
@media (max-width: 700px) { .review-card { grid-template-columns: 1fr; } }

.progress { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--saving); border-radius: 5px; }

/* dreams */
.dream { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; background: var(--surface); box-shadow: var(--shadow); }
.dream + .dream { margin-top: 14px; }
.dream-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.dream-title { font-size: 17px; font-weight: 700; }
.dream-figs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 14px 0; }
.dream-figs .f .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; font-weight: 600; }
.dream-figs .f .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
@media (max-width: 700px) { .dream-figs { grid-template-columns: 1fr 1fr; } }
.callout { padding: 10px 12px; border-radius: 10px; font-size: 13px; }
.callout.good { background: var(--good-soft); color: var(--good); }
.callout.warn { background: var(--warn-soft); color: var(--warn); }
.callout.bad { background: var(--bad-soft); color: var(--bad); }
.callout.info { background: var(--accent-soft); color: var(--accent); }
.callout b { font-weight: 700; }
.reco { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; }
.reco li { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 6px 10px; background: var(--surface-2); border-radius: 8px; }
.hero-num { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* upload / empty */
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 28px; text-align: center; background: var(--surface); cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.empty { text-align: center; padding: 40px 20px; }
.empty .big { font-size: 40px; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; text-align: left; max-width: 520px; margin-inline: auto; }
.steps li { counter-increment: s; display: flex; gap: 10px; align-items: flex-start; }
.steps li::before { content: counter(s); flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.banner { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 13px; flex-wrap: wrap; }

/* modal & toast */
.modal-wrap { position: fixed; inset: 0; background: rgba(10,12,16,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; width: min(760px, 100%); max-height: 90vh; overflow: auto; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3); border: 1px solid var(--line); }
.modal h2 { margin-bottom: 10px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 500; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #15171a; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 60; font-size: 13px; max-width: 90vw; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
@media (max-width: 700px) { .topbar { position: static; } .tabs { top: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill-tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.pill-tabs button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 12px; }
.pill-tabs button.on { background: var(--accent); color: #fff; }
details summary { cursor: pointer; font-weight: 600; }
code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">₹</span><div><div class="brand-name">Personal Finance Analyser</div><div class="brand-sub" id="whoLine">Income · Spending · Dreams</div></div></div>
  <div class="top-actions">
    <span class="save-pill" id="savePill" title="Where your data is saved"></span>
    <button class="btn primary" id="btnUpload">＋ Add statement</button>
    <button class="btn" id="btnAuth">Sign in with Microsoft</button>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="dashboard" class="active">Dashboard</button>
  <button data-tab="dreams">Dream Planner</button>
  <button data-tab="review">Review <span class="badge" id="reviewBadge" hidden>0</span></button>
  <button data-tab="transactions">Transactions</button>
  <button data-tab="statements">Statements</button>
  <button data-tab="settings">Settings</button>
</nav>
<main id="main">
  <section id="tab-dashboard" class="tab"></section>
  <section id="tab-dreams" class="tab" hidden></section>
  <section id="tab-review" class="tab" hidden></section>
  <section id="tab-transactions" class="tab" hidden></section>
  <section id="tab-statements" class="tab" hidden></section>
  <section id="tab-settings" class="tab" hidden></section>
</main>
<input type="file" id="fileInput" accept=".pdf,.csv,.xls,.xlsx" multiple hidden>
<div class="modal-wrap" id="modalWrap" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
/* ===== Statement parser (works in browser and Node for testing) ===== */
(function (root) {
  'use strict';
  const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  const pad = n => String(n).padStart(2, '0');

  function mk(y, mo, d) {
    if (!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31 && y >= 1990 && y <= 2100)) return null;
    return `${y}-${pad(mo)}-${pad(d)}`;
  }

  // Indian statements are day-first. prefer = 'dmy' | 'mdy'
  function parseDate(v, prefer) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') {
      if (v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return d.toISOString().slice(0, 10); }
      return null;
    }
    if (v instanceof Date) { if (isNaN(v)) return null; const d = new Date(v.getTime() + 12 * 3600 * 1000); return mk(d.getFullYear(), d.getMonth() + 1, d.getDate()); }  // Excel dates can arrive a few seconds before midnight
    const s = String(v).trim();
    let m;
    if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return mk(+m[1], +m[2], +m[3]);
    if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})(?!\d)/))) {
      let a = +m[1], b = +m[2], y = +m[3];
      if (y < 100) y += 2000;
      if (prefer === 'mdy') [a, b] = [b, a];
      if (b > 12 && a <= 12) [a, b] = [b, a];
      return mk(y, b, a);
    }
    if ((m = s.match(/^(\d{1,2})[-\s\/.,]*([A-Za-z]{3,9})[-\s\/.,]*(\d{2,4})(?!\d)/))) {
      const mo = MONTHS[m[2].slice(0, 3).toLowerCase()];
      let y = +m[3]; if (y < 100) y += 2000;
      return mo ? mk(y, mo, +m[1]) : null;
    }
    if ((m = s.match(/^([A-Za-z]{3,9})\s+(\d{1,2}),?\s+(\d{4})/))) {
      const mo = MONTHS[m[1].slice(0, 3).toLowerCase()];
      return mo ? mk(+m[3], mo, +m[2]) : null;
    }
    return null;
  }
  const DATE_START = /^(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}[-\s][A-Za-z]{3,9}[-\s,]+\d{2,4})(?!\d)/;

  function parseAmount(v) {
    if (typeof v === 'number') return isFinite(v) ? v : null;
    if (v == null) return null;
    let s = String(v).replace(/[₹,\s]/g, '').replace(/^INR|INR$/i, '').replace(/^Rs\.?/i, '');
    if (!s) return null;
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    s = s.replace(/(CR|DR)\.?$/i, '');
    if (s.startsWith('-')) { neg = true; s = s.slice(1); }
    if (!/^\d+(\.\d+)?$/.test(s)) return null;
    const n = parseFloat(s);
    return neg ? -n : n;
  }
  const AMT_RE = /^-?[\d,]+\.\d{1,2}(\s?(Cr|Dr|CR|DR))?$/;
  const TYPE_RE = /^(DR|CR|Dr|Cr|DR\.|CR\.|Dr\.|Cr\.|Debit|Credit|DEBIT|CREDIT|D|C)$/;

  // ---------- hashing ----------
  function hash(str) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }

  // ---------- payee extraction ----------
  const IFSC_RE = /^[A-Z]{4}0[A-Z0-9]{6}$/;
  const NOISE_NOTE = /^(upi|upiintent|payment|paymentfromph(one)?|paymentfrom|payto.*|paidvia.*|generating|sent|na|express|collect.*|.*request|ok|oid.*|pay|transfer|imps|neft|mandate.*)$/;
  const MONTH_WORD = /^(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec|january|february|march|april|june|july|august|september|october|november|december)$/i;

  function titleCase(s) {
    return s.toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase()).replace(/\s+/g, ' ').trim();
  }
  function isVpaLike(s) {
    if (!s) return false;
    const t = s.replace(/\s/g, '');
    if (t.includes('@')) return true;
    return /^[a-z0-9._-]{5,}$/.test(t) && /[0-9.]/.test(t);
  }
  function vpaKey(v) {
    let t = v.replace(/\s/g, '').toLowerCase();
    t = t.split('@')[0];
    t = t.replace(/-\d{1,2}$/, '');
    return t;
  }
  function noteKeyOf(note) {
    const k = (note || '').toLowerCase().replace(/[^a-z]/g, '');
    if (k.length < 3 || NOISE_NOTE.test(k)) return '';
    return k;
  }
  function cleanSeg(s) { return (s || '').replace(/\s+/g, ' ').trim(); }

  function parsePayee(rawDesc) {

        vpa = p.slice(2, ifscIdx).join('-');

        if (rest.length && /^\d{9,}$/.test(rest[0].replace(/\s/g, ''))) rest = rest.slice(1);

        vpa = p[2] || '';

        kind, key, vpa: vpa.replace(/\s/g, '').toLowerCase(), note: note.toLowerCase(), noteKey: nk,

    }

    const segs = d.split(/[\/\-:~]/).map(s => s.trim()).filter(Boolean);
    const keep = [];
    for (const s of segs) {
      const t = s.replace(/\s/g, '');
      if (!t) continue;
      if ((t.match(/\d/g) || []).length >= 5) continue;           // refs, account numbers
      if (IFSC_RE.test(t.toUpperCase())) continue;
      const words = s.split(/\s+/).filter(w => !/\d/.test(w) && !MONTH_WORD.test(w));
      if (!words.length) continue;
      keep.push(words.join(' '));

    }

    let pretty = titleCase(label)
      .replace(/^Bil\b\s*/, 'Bill Pay · ').replace(/\bCredit Ca\b/, 'Credit Card')
      .replace(/^(Icsp )?By Sal\b.*|^Salary\b.*|^Sal\b.*/i, 'Salary')
      .replace(/^Int\.?\s?Pd\b.*|^Interest\b.*/i, 'Interest')
      .replace(/^Rev Upi\b.*/i, 'UPI reversal / refund');

  }

  // ---------- meta (name / account / period) ----------
  function findMeta(lines, itemRows) {
    const meta = { name: '', account: '', periodRaw: null, bank: '' };
    const text = lines.join('\n');
    let m = text.match(/(?:account\s*(?:no|number|num)\.?|a\/c\s*(?:no\.?|number)?)\s*:?\s*[:\-]?\s*:?\s*([0-9Xx*]{6,22})/i);
    if (m) meta.account = m[1].toUpperCase();
    // Name: label item followed by value, or MR/MRS item followed by name
    if (itemRows) {
      outer:
      for (const row of itemRows) {
        const it = row.items;
        for (let i = 0; i < it.length; i++) {
          const s = it[i].s.trim();
          let mm;
          if (/^(MR|MRS|MS|MISS|M\/S|SHRI|SMT|DR)\.?$/i.test(s) && it[i + 1] && /^[A-Za-z][A-Za-z .']{2,60}$/.test(it[i + 1].s.trim())) { meta.name = it[i + 1].s.trim(); break outer; }
          if ((mm = s.match(/^(?:MR|MRS|MS|MISS|SHRI|SMT)\.?\s+([A-Z][A-Za-z .']{2,60})$/))) { meta.name = mm[1].trim(); break outer; }
          if (/^(customer\s*name|account\s*(holder\s*)?name|name\s*of\s*(the\s*)?(customer|account\s*holder)|name)\s*:?$/i.test(s) && it[i + 1]) {
            const v = it[i + 1].s.replace(/^[:\s-]+/, '').trim() || (it[i + 2] ? it[i + 2].s.trim() : '');
            if (/^[A-Za-z][A-Za-z .']{2,60}$/.test(v)) { meta.name = v; break outer; }
          }
          if ((mm = s.match(/^(?:customer\s*name|account\s*(?:holder\s*)?name|name)\s*[:\-]\s*([A-Za-z][A-Za-z .']{2,60})$/i))) { meta.name = mm[1].trim(); break outer; }
        }
      }
    } else {
      m = text.match(/(?:customer\s*name|account\s*(?:holder\s*)?name|account\s*name|name)\s*[:\-]\s*([A-Za-z][A-Za-z .']{2,60})/i);
      if (m) meta.name = m[1].trim();
      else if ((m = text.match(/\b(?:MR|MRS|MS|MISS)\.?\s+([A-Z][A-Z .']{2,60})/))) meta.name = m[1].trim();
    }
    meta.name = meta.name.replace(/\s{2,}.*/, '').replace(/^(MR|MRS|MS|MISS|SHRI|SMT)\.?\s+/i, '').trim();
    m = text.match(/(?:from|period)\s*:?\s*(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4}|\d{1,2}[-\s][A-Za-z]{3,9}[-\s]\d{2,4})\s*(?:to|-|till)\s*:?\s*(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4}|\d{1,2}[-\s][A-Za-z]{3,9}[-\s]\d{2,4})/i);
    if (m) meta.periodRaw = [m[1], m[2]];
    const banks = [['HDFC BANK', 'HDFC Bank'], ['ICICI BANK', 'ICICI Bank'], ['STATE BANK OF INDIA', 'SBI'], ['KOTAK MAHINDRA', 'Kotak'], ['AXIS BANK', 'Axis Bank'], ['PUNJAB NATIONAL', 'PNB'], ['BANK OF BARODA', 'Bank of Baroda'], ['YES BANK', 'Yes Bank'], ['IDFC FIRST', 'IDFC First'], ['CANARA BANK', 'Canara Bank'], ['UNION BANK', 'Union Bank'], ['INDUSIND', 'IndusInd'], ['FEDERAL BANK', 'Federal Bank'], ['SARASWAT', 'Saraswat Bank']];
    const head = lines.slice(0, 40).join(' ').toUpperCase();
    for (const [k, v] of banks) if (head.includes(k)) { meta.bank = v; break; }

  }

  function resolvePeriod(meta, txs) {
    const dates = txs.map(t => t.date).sort();
    const lo = dates[0], hi = dates[dates.length - 1];
    if (meta.periodRaw) {
      for (const pref of ['dmy', 'mdy']) {
        const a = parseDate(meta.periodRaw[0], pref), b = parseDate(meta.periodRaw[1], pref);

  }

  // ---------- PDF: rows from pdf.js ----------
  async function pdfToPages(pdfjsLib, data, password) {
    const doc = await pdfjsLib.getDocument({ data, password: password || undefined, isEvalSupported: false }).promise;
    const pages = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);

      const items = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ x: i.transform[4], y: i.transform[5], w: i.width || 0, s: i.str }));
      items.sort((a, b) => b.y - a.y || a.x - b.x);

        const r = rows.find(r => Math.abs(r.y - it.y) <= 2);
        if (r) r.items.push(it); else rows.push({ y: it.y, items: [it] });
      }

      for (const r of rows) { r.items.sort((a, b) => a.x - b.x); r.text = r.items.map(i => i.s.trim()).join(' '); }

  const STOP_RE = /(statement summary|opening balance|system[- ]generated|computer generated|^page\s*(no)?\s*\.?\s*:?\s*\d|generated on|end of statement|^\*{3}|^total\b|abbreviations|legends?\s*:|^this is a)/i;

  function headerLayout(row) {
    const t = row.text.toLowerCase();
    if (!/\bdate\b|\bdt\b/.test(t)) return null;
    if (!/(narration|description|particulars|details|remarks|transaction)/.test(t)) return null;
    const find = re => { const it = row.items.find(i => re.test(i.s.toLowerCase().trim())); return it ? it.x : null; };

  }

  function parsePdfPages(pages) {
    const lines = [];

        const firstTxt = row.items.slice(0, 3).map(x => x.s.trim()).join(' ');

        }
        if (prevY != null && isDate) gaps.push(prevY - row.y);

            if (compact.length <= skipDateChars && (cur.dateRaw.replace(/\s/g, '').includes(compact))) { skipDateChars -= compact.length; continue; }
            if (compact.startsWith(cur.dateRaw.replace(/\s/g, ''))) { s = s.slice(cur.dateRaw.length).trim(); skipDateChars = 0; if (!s) continue; }

            if (AMT_RE.test(s) && it.x >= layout.cols[0].x - 60) {

              for (const c of layout.cols) if (c.x < right - 1) col = c;
              if (col) { cur[col.k] = parseAmount(s); continue; }
            }
            if (it.x >= layout.descMin && it.x < (layout.descEnd || 1e9) - 2) descParts.push(s);
          } else {
            if (AMT_RE.test(s) && it.x >= layout.amtX - 60 && (layout.typeX == null || it.x < layout.typeX - 5) && (layout.balX == null || it.x < layout.balX - 5)) {

            }

            if (it.x >= layout.descMin && it.x < (layout.descEnd || 1e9) - 2) descParts.push(s);
          }
        }
        if (descParts.length) cur.lines.push(descParts.join(' '));
      }
    }
    let out = [];
    if (layout) {
      for (const c of txs) {
        const date = parseDate(c.dateRaw, 'dmy');
        if (!date) continue;
        const desc = c.lines.join(' ').replace(/\s+/g, ' ').trim();
        let amount, type;
        if (layout.mode === 'columns') {
          if (c.w != null && c.w !== 0) { amount = Math.abs(c.w); type = 'debit'; }
          else if (c.d != null && c.d !== 0) { amount = Math.abs(c.d); type = 'credit'; }
          else continue;
        } else {
          if (c.amt == null) continue;
          amount = Math.abs(c.amt);
          type = c.type ? (/^(d|dr)/i.test(c.type) ? 'debit' : 'credit') : (c.amt < 0 ? 'debit' : null);

        }
        out.push({ date, desc, amount, type, balance: c.b });

      out = textFallback(lines, warnings);
    }
    return { meta, txs: out, mode: layout ? layout.mode : 'text', summary, warnings: [...new Set(warnings)] };
  }

  // Unknown layout: blocks that start with a date; amount followed by Dr/Cr
  function textFallback(lines, warnings) {
    const out = []; let block = null; const blocks = [];
    for (const l of lines) {
      const m = l.match(DATE_START);
      if (m) { block = { dateRaw: m[1], text: l.slice(m[0].length) }; blocks.push(block); }
      else if (block) block.text += ' ' + l;
    }
    for (const b of blocks) {
      const date = parseDate(b.dateRaw, 'dmy'); if (!date) continue;
      const mm = [...b.text.matchAll(/([\d,]+\.\d{2})\s*(CR|DR|Cr|Dr)\b/g)];
      if (mm.length) {
        const m = mm[0];
        out.push({ date, desc: b.text.slice(0, m.index).replace(/\s+/g, ' ').trim(), amount: parseAmount(m[1]), type: /^d/i.test(m[2]) ? 'debit' : 'credit' });
      }

    if (!out.length) warnings.push('Could not read this PDF layout. Please download the statement as Excel/CSV from your bank and import that.');
    return out;
  }

  // ---------- CSV / Excel rows (array of arrays) ----------
  function parseTableRows(rows) {
    const warnings = [];
    const norm = v => String(v == null ? '' : v).toLowerCase().replace(/\s+/g, ' ').trim();
    let hi = -1, map = null;
    for (let i = 0; i < Math.min(rows.length, 60); i++) {
      const cells = (rows[i] || []).map(norm);
      const idx = re => cells.findIndex(c => re.test(c));
      const date = cells.findIndex(c => /date/.test(c) && !/value/.test(c));
      const desc = idx(/narration|description|particulars|details|remarks|transaction remarks/);
      const deb = idx(/withdraw|debit|^dr\.?$|dr amount|paid out/);
      const cre = idx(/deposit|credit|^cr\.?$|cr amount|paid in/);
      const amt = idx(/^amount|transaction amount|amount \(/);
      const typ = idx(/^type$|dr\s*\/\s*cr|cr\s*\/\s*dr|debit\s*\/\s*credit|^txn type$/);
      const bal = idx(/balance/);
      if (date >= 0 && desc >= 0 && ((deb >= 0 && cre >= 0) || amt >= 0)) { hi = i; map = { date: date >= 0 ? date : idx(/date/), desc, deb, cre, amt, typ, bal }; break; }
    }
    const preLines = rows.slice(0, hi < 0 ? 20 : hi).map(r => (r || []).filter(c => c !== '' && c != null).join(' : '));
    const meta = findMeta(preLines, null);
    const txs = [];
    if (!map) { warnings.push('Could not find the header row (Date / Narration / Withdrawal / Deposit) in this file.'); return { meta, txs, mode: 'table', warnings }; }
    for (let i = hi + 1; i < rows.length; i++) {
      const r = rows[i] || [];
      const date = parseDate(r[map.date], 'dmy');
      if (!date) continue;
      const desc = String(r[map.desc] == null ? '' : r[map.desc]).replace(/\s+/g, ' ').trim();
      let amount = null, type = null;
      if (map.deb >= 0 && map.cre >= 0) {
        const w = parseAmount(r[map.deb]), d = parseAmount(r[map.cre]);
        if (w) { amount = Math.abs(w); type = 'debit'; } else if (d) { amount = Math.abs(d); type = 'credit'; }
      } else {
        const raw = r[map.amt];
        const a = parseAmount(raw);
        if (a == null || a === 0) continue;
        amount = Math.abs(a);
        const t = map.typ >= 0 ? norm(r[map.typ]) : '';
        if (t) type = /^d|withdraw/.test(t) ? 'debit' : 'credit';
        else if (/cr\.?$/i.test(String(raw))) type = 'credit';
        else if (/dr\.?$/i.test(String(raw))) type = 'debit';
        else type = a < 0 ? 'debit' : 'credit';
      }
      if (!amount) continue;
      txs.push({ date, desc, amount, type, balance: map.bal >= 0 ? parseAmount(r[map.bal]) : null });
    }
    return { meta, txs, mode: 'table', warnings };
  }

  // Finalise: ids, payee info, period
  function finalise(result, fileName) {
    const seen = {};
    for (const t of result.txs) {
      const base = [t.date, t.amount.toFixed(2), t.type, t.desc.toUpperCase().replace(/[^A-Z0-9]/g, '')].join('|');
      seen[base] = (seen[base] || 0) + 1;
      t.id = hash(base + '#' + seen[base]);
      t.payee = parsePayee(t.desc);
    }
    if (!result.meta.account && fileName) {
      const m = fileName.match(/X{2,}(\d{3,6})|(\d{9,18})/i);
      if (m) result.meta.account = m[1] ? 'XX' + m[1] : m[2];
    }
    result.period = resolvePeriod(result.meta, result.txs);
    result.totals = result.txs.reduce((a, t) => { a[t.type] += t.amount; a[t.type + 'Count']++; return a; }, { debit: 0, credit: 0, debitCount: 0, creditCount: 0 });

  }

})(typeof window !== 'undefined' ? window : globalThis);

  constructor(base) { this.kind = 'onedrive'; this.label = 'OneDrive'; this.base = base; }

  url(absPath) { return GRAPH + '/root:/' + absPath.split('/').map(encodeURIComponent).join('/'); }
  async api(method, url, body, ctype, tries = 0) {
    const token = await Auth.token();
    const headers = { Authorization: 'Bearer ' + token };

    let r;
    try { r = await fetch(url, { method, headers, body, cache: 'no-store' }); }

    }

  }
  async readJSON(p) {
    const r = await this.api('GET', this.url(this.abs(p)) + ':/content');

  }

  }

  }

  }
}

function recurringTable() {
  const rows = recurring();
  if (!rows.length) return '<p class="muted">Not enough months yet. Recurring payments show up once you have 2–3 months of statements.</p>';
  return `<div class="table-wrap"><table><thead><tr><th>Paid to</th><th>Category</th><th class="amt">Avg / month</th><th>Months</th><th>Last paid</th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${esc(r.label)}</b>${r.note ? `<div class="desc-sub">${esc(r.note)}</div>` : ''}</td><td>${esc(r.cat || 'Uncategorised')}</td><td class="amt">${inr(r.avg)}</td><td>${r.n} of ${r.of}</td><td>${fmtDate(r.last)}</td></tr>`).join('')}</tbody></table></div>`;
}
function momTable(months) {
  const stats = months.map(monthStats); const cats = {};
  stats.forEach(s => Object.entries(s.exp).forEach(([c, v]) => { cats[c] = (cats[c] || 0) + v; }));
  const list = Object.entries(cats).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  if (!list.length) return '<p class="muted">No spending yet.</p>';
  const fullIdx = stats.map((s, i) => s.partial ? -1 : i).filter(i => i >= 0);
  const [ia, ib] = fullIdx.length >= 2 ? fullIdx.slice(-2) : [stats.length - 2, stats.length - 1];
  const canCmp = ia >= 0 && ib > ia;
  return `<div class="table-wrap"><table><thead><tr><th>Category</th>${months.map(m => `<th class="amt">${monthShort(m)}${isPartial(m) ? '*' : ''}</th>`).join('')}<th class="amt">${canCmp ? `${monthShort(months[ib])} vs ${monthShort(months[ia])}` : 'Change'}</th></tr></thead><tbody>
  ${list.map(c => {
    const vals = stats.map(s => s.exp[c] || 0);
    const d = canCmp ? vals[ib] - vals[ia] : 0;
    return `<tr><td>${esc(c)}</td>${vals.map(v => `<td class="amt">${v ? inr(v) : '<span class="muted">–</span>'}</td>`).join('')}<td class="amt ${d > 0 ? 'delta-down' : d < 0 ? 'delta-up' : ''}">${d ? (d > 0 ? '▲ ' : '▼ ') + inr(Math.abs(d)) : ''}</td></tr>`;
  }).join('')}
  <tr><td><b>Total</b></td>${stats.map(s => `<td class="amt"><b>${inr(s.expense)}</b></td>`).join('')}<td></td></tr></tbody></table></div>`;
}

function dreamCard(d, idx, plan, tl) {
  const p = dreamPlan(d, plan);
  const prog = d.amount ? Math.min(1, (+d.saved || 0) / d.amount) : 0;
  let body = '';
  if (p.rem <= 0) body = `<div class="callout good">You have saved enough for this dream! Mark it as achieved when you buy it.</div>`;
  else if (plan <= 0) body = `<div class="callout bad">At your current saving of ${inr(plan)}/month this dream cannot be reached. See the suggestions above.</div>`;
  else {
    body = `<div class="callout info">At <b>${inr(plan)}/month</b>: ${inr(p.rem)} ÷ ${inr(plan)} = <b>${monthsText(p.months)}</b> → goal achievement: <b>approx ${Math.ceil(p.months)} month${Math.ceil(p.months) > 1 ? 's' : ''}</b> (by ${fmtMonthYear(p.eta)}).</div>`;
  }
  if (p.rem > 0 && p.required != null) {
    const tgt = d.targetDate ? `by ${fmtDate(d.targetDate)}` : `in ${d.targetMonths} months`;
    if (p.extra > 0) {
      const r = recoFor(p.extra);
      body += `<div class="callout warn" style="margin-top:8px">To get it ${tgt}: required savings <b>${inr(p.required)}/month</b>. Current savings ${inr(Math.max(plan, 0))} → <b>additional savings needed: ${inr(p.extra)}/month</b>.</div>`;
      if (r.items.length) body += `<div class="hint" style="margin-top:8px">Recommendation to close the gap:</div><ul class="reco">${r.items.map(x => `<li><span>Reduce ${esc(x.cat)} by ${inr(x.cut)}</span><span class="muted">avg ${inr(x.avg)}/mo</span></li>`).join('')}<li><span><b>Potential additional savings</b></span><span><b>${inr(r.total)}/month</b>${r.total < p.extra ? ` <span class="muted">(still ${inr(p.extra - r.total)} short — consider a later date or a side income)</span>` : ''}</span></li></ul>`;
    } else body += `<div class="callout good" style="margin-top:8px">To get it ${tgt} you need ${inr(p.required)}/month. You save ${inr(plan)} — on track ✓</div>`;
  }
  const rec = recommendations();
  if (p.rem > 0 && plan > 0 && rec.total > 0) {
    const faster = dreamPlan(d, plan + rec.total); const diff = Math.ceil(p.months) - Math.ceil(faster.months);
    if (diff >= 1) body += `<p class="hint" style="margin-top:8px">💡 If you also cut lifestyle spending by ${inr(rec.total)}/month, you get it ${diff} month${diff > 1 ? 's' : ''} earlier (${fmtMonthYear(faster.eta)}).</p>`;
  }
  return `<div class="dream">
    <div class="dream-head"><div><div class="dream-title">${esc(d.name)}</div><div class="hint">Priority ${idx + 1}${tl && S.dreams.filter(x => !x.achieved).length > 1 && isFinite(tl.at) ? ` · in sequence: by ${fmtMonthYear(addMonths(new Date(), Math.ceil(tl.at)))}` : ''}</div></div>
      <div class="row"><button class="btn small" data-act="dream-up" data-id="${d.id}" title="Higher priority" ${idx === 0 ? 'disabled' : ''}>↑</button><button class="btn small" data-act="dream-down" data-id="${d.id}" title="Lower priority">↓</button><button class="btn small" data-act="dream-save" data-id="${d.id}">＋ Add savings</button><button class="btn small" data-act="dream-edit" data-id="${d.id}">Edit</button><button class="btn small" data-act="dream-done" data-id="${d.id}">Achieved</button><button class="btn small danger" data-act="dream-del" data-id="${d.id}">Delete</button></div></div>
    <div class="dream-figs">
      <div class="f"><div class="l">Target</div><div class="v">${inr(d.amount)}</div></div>
      <div class="f"><div class="l">Saved so far</div><div class="v">${inr(+d.saved || 0)}</div></div>
      <div class="f"><div class="l">Remaining</div><div class="v">${inr(p.rem)}</div></div>
      <div class="f"><div class="l">Deadline</div><div class="v">${d.targetDate ? fmtDate(d.targetDate) : d.targetMonths ? d.targetMonths + ' months' : '<span class="muted">none</span>'}</div></div>
    </div>
    <div class="progress" title="${pct(prog)} saved"><i style="width:${(prog * 100).toFixed(1)}%"></i></div>
    <div style="margin-top:12px">${body}</div>
  </div>`;
}

const CHIPS = {
  debit: ['Family Support', 'Rent', 'Investment / SIP', 'EMI / Loan', 'Education', 'Personal Expense', 'House Help / Maid', 'Grocery', 'Food & Dining', 'Self Transfer'],
  credit: ['Salary', 'Received from Family', 'Refund / Cashback', 'Interest', 'Other Income', 'Self Transfer'],
};
function reviewGroups() {
  const g = new Map();
  for (const t of pendingTx()) {
    const small = t.status === 'suggested' && /^Small payment/.test(WHY.get(t.id) || '');
    const k = small ? 'small|' + t.category : entityKey(t, true) + '|' + (t.status === 'unknown' ? '?' : t.category);
    if (!g.has(k)) g.set(k, { key: k, list: [], t, status: t.status, category: t.category, conf: 0, small });
    const x = g.get(k); x.list.push(t); x.conf = Math.max(x.conf, t.confidence || 0);
  }
  for (const x of g.values()) {   // show the clearest name: most frequent, then shortest
    const cnt = {}; x.list.forEach(t => { cnt[t.payee.name] = (cnt[t.payee.name] || 0) + 1; });
    x.name = Object.entries(cnt).sort((a, b) => b[1] - a[1] || a[0].length - b[0].length)[0][0];
  }
  return [...g.values()].map(x => Object.assign(x, { total: sum(x.list.map(t => t.amount)), months: [...new Set(x.list.map(t => t.date.slice(0, 7)))].sort() }))
    .sort((a, b) => (a.status === 'unknown' ? 0 : 1) - (b.status === 'unknown' ? 0 : 1) || b.total - a.total);
}

  const N = S.cat.autoApproveAfter || 5;

  const high = groups.filter(g => g.status === 'suggested' && g.conf >= 75);
  el.innerHTML = `<div class="card">

  </div>
  ${groups.length ? `<div class="row"><h3>${groups.length} payee${groups.length > 1 ? 's' : ''} to review</h3><span class="spacer"></span>${high.length ? `<button class="btn primary" data-act="confirm-high">Confirm all ${high.length} suggestions above 75%</button>` : ''}</div>
  <div>${groups.slice(0, S.ui.reviewLimit).map((g, i) => reviewCard(g, i)).join('')}</div>
  ${groups.length > S.ui.reviewLimit ? `<div class="row" style="justify-content:center"><button class="btn" data-act="review-more">Show more (${groups.length - S.ui.reviewLimit} left)</button></div>` : ''}`

async function handleFiles(files) {
  for (const f of files) { await importFile(f); }
}
function askPassword(name, wrong) {
  return new Promise(res => {
    if (modalResolve) modalResolve(null);
    modalResolve = res;
    openModal(`<h2>Password needed</h2><p><b>${esc(name)}</b> is password-protected.${wrong ? ' <span class="delta-down">That password did not work.</span>' : ''}</p><p class="hint">Most banks use a mix of your name, date of birth or customer ID — check the email the statement came with. The password is only used to open the file here and is not saved.</p>
      <form id="pwF" class="row"><input type="password" id="pw" autocomplete="off" style="flex:1"><button class="btn primary">Open</button><button type="button" class="btn" data-x>Cancel</button></form>`, m => {
      $('#pwF', m).onsubmit = e => { e.preventDefault(); closeModal($('#pw', m).value); };
      $('[data-x]', m).onclick = () => closeModal(null);
    });
  });
}
const SESSION_PASSWORDS = [];   // passwords used in this session: kept in memory only, never saved
async function readPdf(file) {
  if (!window.pdfjsLib) throw new Error('The PDF reader did not load. Check your internet connection and reload.');
  const buf = new Uint8Array(await file.arrayBuffer());
  const open = async pw => { busy(`Reading ${file.name}…`); return P.parsePdfPages(await P.pdfToPages(pdfjsLib, buf.slice(), pw)); };
  const isPw = e => e && e.name === 'PasswordException';
  for (const pw of [''].concat(SESSION_PASSWORDS)) {
    try { return await open(pw); } catch (e) { if (!isPw(e)) throw e; }
  }
  let wrong = false;
  for (let i = 0; i < 6; i++) {
    const pw = await askPassword(file.name, wrong);
    if (pw == null) return null;
    try { const r = await open(pw); if (!SESSION_PASSWORDS.includes(pw)) SESSION_PASSWORDS.unshift(pw); return r; }
    catch (e) { if (!isPw(e)) throw e; wrong = true; }
  }
  throw new Error('Too many wrong passwords.');
}
async function readSheet(file) {
  if (!window.XLSX) throw new Error('The Excel reader did not load. Check your internet connection and reload.');
  busy(`Reading ${file.name}…`);
  let wb;
  if (/\.csv$/i.test(file.name)) wb = XLSX.read(await file.text(), { type: 'string', raw: true });
  else wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  let best = null;
  for (const n of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' });
    const r = P.parseTableRows(rows);
    if (!best || r.txs.length > best.txs.length) best = r;
  }
  return best;
}
async function importFile(file) {
  let res;
  try {
    res = /\.pdf$/i.test(file.name) ? await readPdf(file) : await readSheet(file);
  } catch (e) {
    console.error(e); await ask('Could not read this file', `<p>${esc(file.name)}: ${esc(e.message || e)}</p><p class="hint">Tip: most net-banking sites let you download the statement as Excel or CSV — those always work.</p>`); return;
  }
  if (!res) { closeModal(); return; }
  res = P.finalise(res, file.name);
  if (!res.txs.length) { await ask('No transactions found', `<p>Nothing could be read from <b>${esc(file.name)}</b>.</p>${res.warnings.map(w => `<p class="hint">${esc(w)}</p>`).join('')}`); return; }
  closeModal();
  if (!(await ownerCheck(res))) return;
  const opts = await previewImport(file, res);
  if (!opts) return;
  await commitImport(file, res, opts);
}
async function ownerCheck(res) {
  const sName = res.meta.name;
  const owners = [S.settings.name, ...(S.settings.aliases || [])].filter(Boolean);
  if (sName) {
    if (!owners.length) {
      const ok = await ask('Is this you?', `<p>This statement is in the name of <b>${esc(titleCase(sName))}</b>.</p><p class="hint">From now on, only statements in this name will be accepted.</p>`, [{ label: 'Cancel', value: false }, { label: 'Yes, this is me', value: true, primary: true }]);
      if (!ok) return false;
      S.settings.name = titleCase(sName); markDirty(FILES.settings); return true;
    }
    if (nameMatches(sName, owners)) return true;
    await ask('Statement not accepted', `<p>This statement belongs to <b>${esc(titleCase(sName))}</b>, but this analyser is set up for <b>${esc(S.settings.name)}</b>. It was not added.</p><p class="hint">Only your own statements can be added. If this is your account and the bank spells your name differently, add that spelling in Settings → About you → Other spellings, then try again.</p>`);
    return false;
  }
  const acct = res.meta.account;
  if (acct && S.settings.accounts.some(a => sameAccount(a.number, acct))) return true;
  return !!(await ask('Is this your account?', `<p>This statement does not show the account holder's name${acct ? `, and account <b>${esc(mask(acct))}</b> is new to this analyser` : ''}.</p><p class="hint">Only add statements of accounts in your own name${S.settings.name ? ` (${esc(S.settings.name)})` : ''}.</p>`, [{ label: 'Cancel', value: false }, { label: 'Yes, it is my account', value: true, primary: true }]));
}
function previewImport(file, res) {
  const existing = new Set(allTx().map(t => t.id));
  const dup = res.txs.filter(t => existing.has(t.id)).length;
  const known = S.settings.accounts.find(a => sameAccount(a.number, res.meta.account));
  const sm = res.summary;
  const smOk = sm && Math.abs(sm.debits - res.totals.debit) < 1 && Math.abs(sm.credits - res.totals.credit) < 1;
  return new Promise(resolve => {
    if (modalResolve) modalResolve(null);
    modalResolve = resolve;
    openModal(`<h2>Check before adding</h2>
      <dl class="kv">
        <dt>File</dt><dd>${esc(file.name)}</dd>
        <dt>Bank</dt><dd>${esc(res.meta.bank || 'Not detected')}</dd>
        <dt>Account</dt><dd>${esc(mask(res.meta.account) || 'Not detected')}</dd>
        <dt>Account holder</dt><dd>${esc(res.meta.name ? titleCase(res.meta.name) : 'Not shown on statement')}</dd>
        <dt>Period</dt><dd>${res.period ? `${fmtDate(res.period.from)} – ${fmtDate(res.period.to)}` : '—'}</dd>
        <dt>Credits (income)</dt><dd>${res.totals.creditCount} · ${inr(res.totals.credit, 2)}</dd>
        <dt>Debits (spending)</dt><dd>${res.totals.debitCount} · ${inr(res.totals.debit, 2)}</dd>
        ${sm ? `<dt>Bank's own summary</dt><dd class="${smOk ? 'delta-up' : 'delta-down'}">${smOk ? '✓ Matches exactly' : `✗ Bank says debits ${inr(sm.debits, 2)}, credits ${inr(sm.credits, 2)} — some rows may be misread`}</dd>` : ''}
        ${dup ? `<dt>Already added</dt><dd>${dup} transaction${dup > 1 ? 's' : ''} (will be skipped)</dd>` : ''}
      </dl>
      ${res.warnings.map(w => `<div class="callout warn" style="margin-top:8px">${esc(w)}</div>`).join('')}
      <label class="field" style="margin-top:12px">Name this account<input type="text" id="acLabel" value="${esc(known ? known.label : (res.meta.bank ? res.meta.bank + ' Savings' : 'My account'))}"></label>
      <h4 style="margin-top:12px">First rows</h4>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th class="amt">Amount</th></tr></thead><tbody>
      ${res.txs.slice(0, 6).map(t => `<tr><td class="num">${fmtDate(t.date)}</td><td><b>${esc(t.payee.name)}</b><div class="desc-sub">${esc(t.desc)}</div></td><td class="amt ${t.type}">${t.type === 'credit' ? '+' : '−'}${inr(t.amount, 2)}</td></tr>`).join('')}</tbody></table></div>
      <div class="foot"><button class="btn" data-x>Cancel</button><button class="btn primary" data-go>Add ${res.txs.length - dup} transactions</button></div>`, m => {
      $('[data-x]', m).onclick = () => closeModal(null);
      $('[data-go]', m).onclick = () => closeModal({ label: $('#acLabel', m).value.trim() });
    });
  });
}
function safeName(n) { return n.replace(/[\\/:*?"<>|#%]+/g, '_').slice(0, 120); }
async function commitImport(file, res, opts) {
  const acct = res.meta.account || '';
  const stmtId = P.hash([acct, res.period && res.period.from, res.period && res.period.to, res.txs.length, file.name].join('|'));
  const existing = new Map(allTx().map(t => [t.id, t]));
  let added = 0, dup = 0; const touched = new Set();
  for (const t of res.txs) {
    const ex = existing.get(t.id);
    if (ex) { dup++; if (!ex.stmts.includes(stmtId)) { ex.stmts.push(stmtId); touched.add(ex.date.slice(0, 7)); } continue; }
    const m = t.date.slice(0, 7);
    (S.months[m] = S.months[m] || []).push({
      id: t.id, date: t.date, desc: t.desc, amount: r2(t.amount), type: t.type, balance: t.balance == null ? null : t.balance,
      account: acct, bank: res.meta.bank || '', payee: t.payee, category: null, status: 'unknown', confidence: 0, manual: false, stmts: [stmtId],
    });
    added++; touched.add(m);
  }
  const folderMonth = ((res.period && res.period.to) || res.txs.map(t => t.date).sort().pop()).slice(0, 7);
  const filePath = `Statements/${folderMonth}/${safeName(file.name)}`;
  S.statements = S.statements.filter(s => s.id !== stmtId).concat({
    id: stmtId, file: file.name, path: filePath, bank: res.meta.bank || '', account: acct, holder: res.meta.name || '', label: opts.label,
    from: res.period && res.period.from, to: res.period && res.period.to, count: res.txs.length, added,
    credit: r2(res.totals.credit), debit: r2(res.totals.debit), format: res.mode, importedAt: new Date().toISOString(),
  });
  const a = S.settings.accounts.find(x => sameAccount(x.number, acct));
  if (a) { if (opts.label) a.label = opts.label; } else if (acct) S.settings.accounts.push({ number: acct, bank: res.meta.bank || '', label: opts.label });
  touched.forEach(m => markDirty(monthPath(m)));
  markDirty(FILES.stmts, FILES.settings, FILES.cat);
  resolveAll(); computeAnalysis();
  S.ui.month = null;
  S.store.writeFile(filePath, file).catch(e => toast('Transactions saved, but the original file could not be stored: ' + e.message, 6000));
  const pending = pendingTx().length;
  toast(`Added ${added} new transaction${added === 1 ? '' : 's'}${dup ? ` (${dup} were already there)` : ''}.`);
  if (pending) switchTab('review'); else renderAll();
}
async function deleteStatement(id) {
  const s = S.statements.find(x => x.id === id); if (!s) return;
  const ok = await ask('Remove this statement?', `<p>${esc(s.file)} (${fmtDate(s.from)} – ${fmtDate(s.to)}) and its transactions will be removed${S.store.kind === 'onedrive' ? ', and the original file will be deleted from your OneDrive' : ''}. What the analyser learned about payees is kept.</p><p class="hint">This cannot be undone, but you can add the statement again.</p>`, [{ label: 'Cancel', value: false }, { label: 'Remove', value: true, danger: true }]);
  if (!ok) return;
  for (const m of Object.keys(S.months)) {
    const before = S.months[m].length;
    S.months[m] = S.months[m].filter(t => { t.stmts = (t.stmts || []).filter(x => x !== id); return t.stmts.length > 0; });
    if (S.months[m].length !== before) markDirty(monthPath(m));
  }
  S.statements = S.statements.filter(x => x.id !== id);
  markDirty(FILES.stmts);
  if (s.path) S.store.remove(s.path).catch(() => {});
  computeAnalysis(); renderAll();
}

/* =====================================================================
   ONEDRIVE CONNECT
   ===================================================================== */
async function pickBaseFolder(acct) {
  const saved = LS.get('pfa.folder.' + acct.homeAccountId);
  if (saved) return saved;
  const probe = new OneDriveStore('');
  const first = (acct.name || acct.username || 'Me').split(/[\s@.]/)[0].replace(/[^A-Za-z0-9_-]/g, '') || 'Me';
  const users = (await probe.listAbs(CONFIG.rootFolder)).filter(f => f.folder);
  const match = users.find(u => u.name.toLowerCase() === first.toLowerCase()) || (users.length === 1 ? users[0] : null);
  const base = `${CONFIG.rootFolder}/${match ? match.name : first}`;
  LS.set('pfa.folder.' + acct.homeAccountId, base);
  return base;
}
async function useOneDrive(acct, { quiet } = {}) {
  busy('Connecting to OneDrive…');
  try {
    const base = await pickBaseFolder(acct);
    const store = new OneDriveStore(base);
    await store.ensureStructure();
    const remoteSettings = await store.readJSON(FILES.settings);
    const localKeys = S.local ? await S.local.keys() : [];
    const localHasData = localKeys.some(k => k.startsWith('Statements/'));
    S.store = store;
    if (!remoteSettings && localHasData && !quiet) {
      closeModal();
      const copy = await ask('Copy your data to OneDrive?', '<p>Your OneDrive folder is empty, but this browser has statements and settings saved. Copy them to OneDrive?</p>', [{ label: 'Start fresh in OneDrive', value: false }, { label: 'Copy to OneDrive', value: true, primary: true }]);
      if (copy) { busy('Copying to OneDrive…'); await copyLocalTo(store, localKeys); }
    }
    busy('Loading your data from OneDrive…');
    await loadAll();
    closeModal(); setSave('idle'); renderAll();
    if (!quiet) toast(`Connected to OneDrive › ${base}`);
  } catch (e) { closeModal(); throw e; }
}
async function copyLocalTo(store, keys) {
  for (const k of keys) {
    const v = await S.local.raw(k);
    if (typeof v === 'string') await store.writeJSON(k, JSON.parse(v));
    else if (v instanceof Blob) await store.writeFile(k, v).catch(() => {});
  }
}
async function signIn() {
  if (!Auth.isHttp()) { await ask('Open the web version to sign in', '<p>Microsoft sign-in only works when the app is opened from a web address such as <code>https://yourname.github.io/finance/</code>. See README.md for the free GitHub Pages setup.</p><p class="hint">You can keep using it here — data is saved in this browser.</p>'); return; }
  if (!Auth.clientId()) { switchTab('settings'); toast('Paste your Microsoft Application (client) ID first.'); const i = $('#setClient'); if (i) i.focus(); return; }
  if (!window.msal) { await ask('Sign-in library did not load', '<p>Check your internet connection and reload the page.</p>'); return; }
  try {
    const acct = await Auth.login(); if (!acct) return;
    await useOneDrive(acct);
  } catch (e) {
    console.error(e);
    await ask('Could not connect to OneDrive', `<p>${esc(e.message || e)}</p><p class="hint">Check the client ID and that the redirect URI in Azure is exactly <code>${esc(location.origin + location.pathname)}</code> (platform: Single-page application).</p>`);
  }
}
async function signOut() {
  await saveNow();
  await Auth.logout();
  S.store = S.local; await loadAll(); setSave('idle'); renderAll();
  toast('Signed out. Now showing data saved in this browser.');
}

/* =====================================================================
   EVENTS
   ===================================================================== */
function backupObject() {
  return { app: 'personal-finance-analyser', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, categorization: S.cat, dreams: S.dreams, statements: S.statements, months: Object.fromEntries(allMonths().map(m => [m, S.months[m]])) };
}
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function restoreBackup(file) {
  let j; try { j = JSON.parse(await file.text()); } catch (e) { await ask('Not a backup file', '<p>That file could not be read.</p>'); return; }
  if (!j || j.app !== 'personal-finance-analyser') { await ask('Not a backup file', '<p>This does not look like a backup from this app.</p>'); return; }
  const ok = await ask('Restore backup?', `<p>This replaces the current data ${S.store.kind === 'onedrive' ? 'in your OneDrive folder' : 'in this browser'} with the backup from ${esc(fmtDate((j.exportedAt || '').slice(0, 10)))}.</p>`, [{ label: 'Cancel', value: false }, { label: 'Restore', value: true, primary: true }]);
  if (!ok) return;
  S.settings = Object.assign(defaultSettings(), j.settings || {}); S.cat = Object.assign(defaultCat(), j.categorization || {}); refreshCatMap();
  S.dreams = j.dreams || []; S.statements = j.statements || []; S.months = j.months || {};
  markDirty(FILES.settings, FILES.cat, FILES.dreams, FILES.stmts, ...allMonths().map(monthPath));
  resolveAll(); computeAnalysis(); renderAll(); toast('Backup restored.');
}

document.addEventListener('click', async e => {
  const tabBtn = e.target.closest('#tabs button'); if (tabBtn) { switchTab(tabBtn.dataset.tab); return; }
  const link = e.target.closest('[data-tab-link]'); if (link) { e.preventDefault(); switchTab(link.dataset.tabLink); return; }
  if (e.target.closest('[data-drop]')) { $('#fileInput').click(); return; }
  if (e.target.id === 'modalWrap') { closeModal(null); return; }
  if (e.target.closest('#savePill') && S.saveState === 'err') { saveNow(); return; }
  const chip = e.target.closest('[data-chip]');
  if (chip) { const card = chip.closest('[data-g]'); const g = $('#tab-review')._groups[+card.dataset.g]; confirmTxs(g.list, chip.dataset.chip); toast(`Saved: ${g.name} → ${chip.dataset.chip}`); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  const dream = id ? S.dreams.find(d => d.id === id) : null;
  switch (act) {
    case 'signin': signIn(); break;
    case 'signout': signOut(); break;
    case 'add-dream': dreamForm(); break;
    case 'dream-edit': dreamForm(dream); break;
    case 'dream-del': if (await ask('Delete this dream?', `<p>${esc(dream.name)}</p>`, [{ label: 'Cancel', value: false }, { label: 'Delete', value: true, danger: true }])) { S.dreams = S.dreams.filter(d => d.id !== id); markDirty(FILES.dreams); renderAll(); } break;
    case 'dream-done': dream.achieved = new Date().toISOString(); markDirty(FILES.dreams); renderAll(); toast(`Congratulations on "${dream.name}"! 🎉`); break;
    case 'dream-undo': delete dream.achieved; markDirty(FILES.dreams); renderAll(); break;
    case 'dream-up': case 'dream-down': {
      const act2 = S.dreams.filter(d => !d.achieved); const i = act2.indexOf(dream); const j = act === 'dream-up' ? i - 1 : i + 1;
      if (j < 0 || j >= act2.length) break;
      [act2[i], act2[j]] = [act2[j], act2[i]];
      S.dreams = act2.concat(S.dreams.filter(d => d.achieved)); markDirty(FILES.dreams); renderAll(); break;
    }
    case 'dream-save': {
      const v = await new Promise(res => {
        if (modalResolve) modalResolve(null); modalResolve = res;
        openModal(`<h2>Add savings to "${esc(dream.name)}"</h2><form id="svF" class="row"><input type="number" id="svAmt" min="1" step="1" placeholder="Amount ₹" style="flex:1"><button class="btn primary">Add</button><button type="button" class="btn" data-x>Cancel</button></form>`, m => {
          $('#svF', m).onsubmit = ev => { ev.preventDefault(); closeModal(+$('#svAmt', m).value); };
          $('[data-x]', m).onclick = () => closeModal(null);
        });
      });
      if (v > 0) { dream.saved = (+dream.saved || 0) + v; markDirty(FILES.dreams); renderAll(); }
      break;
    }
    case 'plan-reset': S.settings.planSaving = null; markDirty(FILES.settings); renderDreams(); break;
    case 'confirm-group': {
      const card = b.closest('[data-g]'); const g = $('#tab-review')._groups[+card.dataset.g];
      const cat = $('[data-sel]', card).value; if (!cat) { toast('Choose a category first.'); break; }
      confirmTxs(g.list, cat); toast(g.small ? `Saved ${g.list.length} small payments → ${cat}` : `Saved: ${g.name} → ${cat}`); break;
    }
    case 'confirm-high': {
      const gs = $('#tab-review')._groups.filter(g => g.status === 'suggested' && g.conf >= 75);
      const list = []; const byCat = {};
      gs.forEach(g => { (byCat[g.category] = byCat[g.category] || []).push(...g.list); });
      Object.entries(byCat).forEach(([c, l]) => { l.forEach(t => list.push([t, c])); });
      // confirm per category so learning gets the right category
      for (const [c, l] of Object.entries(byCat)) {
        for (const t of l) { t.manual = true; t.category = c; t.status = 'confirmed'; t.confidence = 100; markDirty(monthPath(t.date.slice(0, 7))); }
        const groups = new Map(); l.forEach(t => { const k = entityKey(t, true); if (!groups.has(k)) groups.set(k, { t, n: 0 }); groups.get(k).n++; });
        groups.forEach(({ t, n }) => learn(t, c, n));
      }
      markDirty(FILES.cat); resolveAll(); computeAnalysis(); renderAll(); toast(`Confirmed ${list.length} transactions.`); break;
    }
    case 'review-more': S.ui.reviewLimit += 40; renderReview(); break;
    case 'tx-more': S.ui.tx.limit += 300; renderTransactions(); break;
    case 'stmt-del': deleteStatement(id); break;
    case 'save-client': { const v = $('#setClient').value.trim(); if (v && !/^[0-9a-f-]{36}$/i.test(v)) { toast('That does not look like a client ID (36 characters with dashes).'); break; } if (v) LS.set('pfa.clientId', v); else LS.del('pfa.clientId'); Auth.pca = null; toast('Saved. Now click "Sign in with Microsoft".'); renderSettings(); break; }
    case 'save-profile': {
      S.settings.name = $('#setName').value.trim();
      S.settings.aliases = $('#setAliases').value.split(',').map(s => s.trim()).filter(Boolean);
      $$('[data-acct-label]').forEach(i => { S.settings.accounts[+i.dataset.acctLabel].label = i.value.trim(); });
      markDirty(FILES.settings); resolveAll(); computeAnalysis(); renderAll(); toast('Saved.'); break;
    }
    case 'acct-del': S.settings.accounts.splice(+b.dataset.i, 1); markDirty(FILES.settings); renderSettings(); break;
    case 'save-learning': S.cat.autoApproveAfter = Math.max(1, +$('#setN').value || 5); S.settings.smallLimit = Math.max(0, +$('#setSmall').value || 0); markDirty(FILES.cat, FILES.settings); resolveAll(); computeAnalysis(); renderAll(); toast('Saved.'); break;
    case 'kw-add': {
      const k = $('#kwText').value.trim(), c = $('#kwCat').value; if (!k || !c) { toast('Enter a keyword and choose a category.'); break; }
      S.cat.keywordRules.push({ keyword: k, type: $('#kwType').value || '', category: c }); markDirty(FILES.cat); resolveAll(); computeAnalysis(); renderAll(); break;
    }
    case 'kw-del': S.cat.keywordRules.splice(+b.dataset.i, 1); markDirty(FILES.cat); resolveAll(); computeAnalysis(); renderAll(); break;
    case 'learn-del': delete S.cat.learned[b.dataset.k]; markDirty(FILES.cat); resolveAll(); computeAnalysis(); renderAll(); break;
    case 'cat-add': {
      const n = $('#catName').value.trim(); if (!n) break; if (CATMAP[n]) { toast('That category already exists.'); break; }
      const kind = $('#catKind').value; S.cat.categories.push({ name: n, kind, group: kind === 'expense' ? $('#catGroup').value : '' });
      refreshCatMap(); markDirty(FILES.cat); renderSettings(); break;
    }
    case 'cat-del': {
      const c = S.cat.categories[+b.dataset.i]; const used = allTx().filter(t => t.category === c.name).length;
      if (!(await ask(`Delete "${c.name}"?`, `<p>${used ? `${used} transactions use it; they will go back to "needs input".` : 'No transactions use it.'}</p>`, [{ label: 'Cancel', value: false }, { label: 'Delete', value: true, danger: true }]))) break;
      S.cat.categories.splice(+b.dataset.i, 1); refreshCatMap();
      allTx().forEach(t => { if (t.category === c.name) { t.manual = false; t.category = null; markDirty(monthPath(t.date.slice(0, 7))); } });
      for (const [k, e] of Object.entries(S.cat.learned)) if (e.category === c.name) delete S.cat.learned[k];
      S.cat.keywordRules = S.cat.keywordRules.filter(r => r.category !== c.name);
      markDirty(FILES.cat); resolveAll(); computeAnalysis(); renderAll(); break;
    }
    case 'export': download(`finance-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(backupObject(), null, 2)); break;
    case 'reset': {
      if (!(await ask('Delete all data in this browser?', '<p>All statements, categories, learning and dreams saved in this browser will be deleted. Download a backup first if you want to keep them. This cannot be undone.</p>', [{ label: 'Cancel', value: false }, { label: 'Delete everything', value: true, danger: true }]))) break;
      for (const k of await S.local.keys()) await S.local.remove(k);
      S.dirty.clear(); await loadAll(); renderAll(); toast('All data in this browser deleted.'); break;
    }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-txcat]')) {
    const id = t.closest('tr').dataset.id; const tx = allTx().find(x => x.id === id);
    if (tx && t.value) { confirmTxs([tx], t.value); toast(`Saved: ${tx.payee.name} → ${t.value}. Other payments to this payee will follow.`); }
  } else if (t.matches('[data-learn]')) {
    const e2 = S.cat.learned[t.dataset.learn]; if (e2 && t.value) { e2.category = t.value; e2.confirmations = 1; markDirty(FILES.cat); resolveAll(); computeAnalysis(); renderAll(); }
  } else if (t.matches('[data-cat-group]')) {
    S.cat.categories[+t.dataset.catGroup].group = t.value; refreshCatMap(); markDirty(FILES.cat);
  } else if (t.id === 'restoreFile' && t.files[0]) { restoreBackup(t.files[0]); t.value = ''; }
  else if (t.id === 'catKind') { $('#catGroup').hidden = t.value !== 'expense'; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modalWrap').hidden) closeModal(null); });
['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d) { e.preventDefault(); d.classList.add('over'); } }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d) d.classList.remove('over'); }));
document.addEventListener('drop', e => { if (e.target.closest && e.target.closest('[data-drop]')) { e.preventDefault(); handleFiles([...e.dataTransfer.files]); } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot() {
  $('#btnUpload').onclick = () => $('#fileInput').click();
  $('#fileInput').onchange = e => { const f = [...e.target.files]; e.target.value = ''; handleFiles(f); };
  $('#btnAuth').onclick = () => (S.store && S.store.kind === 'onedrive') ? signOut() : signIn();
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
  if (window.Chart) { Chart.defaults.font.family = getComputedStyle(document.body).fontFamily; Chart.defaults.color = cssv('--text-2'); }
  $('#tab-dashboard').innerHTML = '<div class="card"><span class="spinner"></span> Loading…</div>';
  const tab = (location.hash || '').slice(1);
  if (['dashboard', 'dreams', 'review', 'transactions', 'statements', 'settings'].includes(tab)) S.ui.tab = tab;
  $$('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === S.ui.tab));
  $$('.tab').forEach(s => { s.hidden = s.id !== 'tab-' + S.ui.tab; });
  S.local = await LocalStore.create();
  let acct = null;
  try { acct = await Auth.init(); } catch (e) { console.warn('MSAL init failed', e); }
  if (acct) {
    try { await useOneDrive(acct, { quiet: true }); return; }
    catch (e) { console.error(e); toast('Could not reach OneDrive (' + e.message + '). Showing data saved in this browser.', 6000); }
  }
  S.store = S.local;
  await loadAll(); setSave('idle'); renderAll();
}
window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => renderAll());
boot();
